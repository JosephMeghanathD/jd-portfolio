<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    @keyframes breathe-l {
      0%, 100% { stroke-opacity: 0.55; }
      45%       { stroke-opacity: 0.95; }
    }
    @keyframes breathe-r {
      0%, 100% { stroke-opacity: 0.55; }
      45%       { stroke-opacity: 0.95; }
    }
    @keyframes blink-l {
      0%, 100% { opacity: 0.18; }
      10%       { opacity: 1;    }
      40%       { opacity: 0.18; }
      65%       { opacity: 1;    }
      85%       { opacity: 0.18; }
    }
    @keyframes blink-r {
      0%, 100% { opacity: 0.18; }
      10%       { opacity: 1;    }
      40%       { opacity: 0.18; }
      65%       { opacity: 1;    }
      85%       { opacity: 0.18; }
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 0.4; r: 1.6px; }
      50%       { opacity: 1;   r: 2px;   }
    }
    @keyframes ring-expand {
      0%   { r: 1.6px; opacity: 0.75; stroke-width: 1.2px; }
      100% { r: 10px;  opacity: 0;    stroke-width: 0.1px;  }
    }
    .chev-l { animation: breathe-l 4s ease-in-out infinite; }
    .chev-r { animation: breathe-r 4s ease-in-out infinite 1.2s; }
    .tip-l  { animation: blink-l 6s ease-in-out infinite; }
    .tip-r  { animation: blink-r 6s ease-in-out infinite 0.9s; }
    .dot    { animation: dot-pulse 2.8s ease-in-out infinite; }
    .ring   { animation: ring-expand 2s ease-out infinite 1.5s; animation-iteration-count: infinite; }
  </style>

  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#09090B"/>

  <!-- < left chevron -->
  <path
    class="chev-l"
    d="M 9 5 L 4 16 L 9 27"
    stroke="#22D3EE"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    stroke-opacity="0.55"
  />

  <!-- > right chevron -->
  <path
    class="chev-r"
    d="M 23 5 L 28 16 L 23 27"
    stroke="#22D3EE"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    stroke-opacity="0.55"
  />

  <!-- Left tip node -->
  <circle class="tip-l" cx="4" cy="16" r="1.5" fill="#22D3EE" opacity="0.18"/>

  <!-- Right tip node -->
  <circle class="tip-r" cx="28" cy="16" r="1.5" fill="#22D3EE" opacity="0.18"/>

  <!-- JD text -->
  <text
    x="16"
    y="19"
    text-anchor="middle"
    font-family="monospace"
    font-weight="700"
    font-size="8.5"
    fill="#FAFAFA"
    letter-spacing="1"
  >JD</text>

  <!-- Accent dot -->
  <circle class="dot" cx="16" cy="25.5" r="1.6" fill="#22D3EE"/>

  <!-- Ring pulse (starts hidden, expands outward) -->
  <circle
    class="ring"
    cx="16"
    cy="25.5"
    r="1.6"
    fill="none"
    stroke="#22D3EE"
    stroke-width="1.2"
    opacity="0"
  />
</svg>
