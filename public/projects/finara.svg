<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <pattern id="fg" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="rgba(255,255,255,0.055)"/>
    </pattern>
    <linearGradient id="nbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="barg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(34,211,238,0.85)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,0.25)"/>
    </linearGradient>
    <filter id="cglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes cur { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { animation: cur 1.1s step-end infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#nbg)"/>
  <rect width="800" height="450" fill="url(#fg)"/>

  <!-- Subtle top glow -->
  <ellipse cx="400" cy="-40" rx="340" ry="120" fill="rgba(34,211,238,0.06)"/>

  <!-- ── Nav bar ── -->
  <rect width="800" height="46" fill="rgba(255,255,255,0.035)"/>
  <rect y="45" width="800" height="1" fill="rgba(255,255,255,0.07)"/>

  <!-- Logo -->
  <text x="20" y="30" font-family="monospace" font-size="15" font-weight="700" fill="#FAFAFA">Finara</text>
  <rect x="76" y="19" width="1" height="16" fill="rgba(255,255,255,0.12)"/>
  <text x="84" y="29" font-family="monospace" font-size="8" fill="rgba(34,211,238,0.7)">AI FINANCIAL</text>

  <!-- Nav links -->
  <text x="260" y="30" font-family="monospace" font-size="10" fill="rgba(161,161,170,0.5)">Overview</text>
  <text x="348" y="30" font-family="monospace" font-size="10" fill="rgba(34,211,238,0.9)" font-weight="700">Spending</text>
  <text x="438" y="30" font-family="monospace" font-size="10" fill="rgba(161,161,170,0.5)">Forecast</text>
  <text x="520" y="30" font-family="monospace" font-size="10" fill="rgba(161,161,170,0.5)">Insights</text>
  <text x="606" y="30" font-family="monospace" font-size="10" fill="rgba(161,161,170,0.5)">Budget</text>

  <!-- Upload btn -->
  <rect x="700" y="12" width="84" height="24" rx="5" fill="rgba(34,211,238,0.15)" stroke="rgba(34,211,238,0.4)" stroke-width="1"/>
  <text x="742" y="28" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(34,211,238,0.9)">+ Upload CSV</text>

  <!-- ── Stat cards row ── -->

  <!-- Card 1: Total Spending -->
  <rect x="16" y="60" width="180" height="82" rx="8" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="28" y="84" font-family="monospace" font-size="8.5" fill="rgba(161,161,170,0.55)">TOTAL SPENDING</text>
  <text x="28" y="114" font-family="monospace" font-size="24" font-weight="700" fill="#FAFAFA">$4,842</text>
  <text x="28" y="132" font-family="monospace" font-size="8.5" fill="rgba(34,211,238,0.7)">▲ 8.2% vs last month</text>

  <!-- Card 2: Top Category -->
  <rect x="208" y="60" width="180" height="82" rx="8" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="220" y="84" font-family="monospace" font-size="8.5" fill="rgba(161,161,170,0.55)">TOP CATEGORY</text>
  <text x="220" y="114" font-family="monospace" font-size="22" font-weight="700" fill="#FAFAFA">Dining</text>
  <text x="220" y="132" font-family="monospace" font-size="8.5" fill="rgba(251,146,60,0.75)">▲ 34% of monthly budget</text>

  <!-- Card 3: Anomalies -->
  <rect x="400" y="60" width="180" height="82" rx="8" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="412" y="84" font-family="monospace" font-size="8.5" fill="rgba(161,161,170,0.55)">ANOMALIES</text>
  <text x="412" y="114" font-family="monospace" font-size="24" font-weight="700" fill="#FAFAFA">3</text>
  <text x="412" y="132" font-family="monospace" font-size="8.5" fill="rgba(239,68,68,0.7)">● Flagged this period</text>

  <!-- Card 4: AI Status -->
  <rect x="592" y="60" width="192" height="82" rx="8" fill="rgba(34,211,238,0.05)" stroke="rgba(34,211,238,0.22)" stroke-width="1"/>
  <text x="604" y="84" font-family="monospace" font-size="8.5" fill="rgba(34,211,238,0.6)">AI ENGINE</text>
  <text x="604" y="110" font-family="monospace" font-size="15" font-weight="700" fill="#FAFAFA">Gemma 3:4b</text>
  <text x="604" y="128" font-family="monospace" font-size="8" fill="rgba(34,211,238,0.6)">● 14 insights · local inference</text>
  <circle cx="670" cy="58" r="20" fill="rgba(34,211,238,0.06)" filter="url(#cglow)"/>

  <!-- ── Bottom panels ── -->

  <!-- LEFT: Bar chart panel -->
  <rect x="16" y="158" width="386" height="256" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="28" y="182" font-family="monospace" font-size="10" font-weight="700" fill="rgba(250,250,250,0.7)">Monthly Spending</text>
  <text x="388" y="182" text-anchor="end" font-family="monospace" font-size="8" fill="rgba(161,161,170,0.4)">Jan – Aug 2025</text>

  <!-- Y-axis guide lines -->
  <line x1="28" y1="196" x2="390" y2="196" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="28" y1="234" x2="390" y2="234" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="28" y1="272" x2="390" y2="272" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="28" y1="310" x2="390" y2="310" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Bars (from bottom at y=352, going up) -->
  <rect x="42"  y="304" width="32" height="48" rx="3" fill="url(#barg)" opacity="0.6"/>
  <rect x="88"  y="270" width="32" height="82" rx="3" fill="url(#barg)" opacity="0.7"/>
  <rect x="134" y="288" width="32" height="64" rx="3" fill="url(#barg)" opacity="0.65"/>
  <rect x="180" y="258" width="32" height="94" rx="3" fill="url(#barg)" opacity="0.75"/>
  <rect x="226" y="240" width="32" height="112" rx="3" fill="url(#barg)" opacity="0.8"/>
  <rect x="272" y="262" width="32" height="90" rx="3" fill="url(#barg)" opacity="0.72"/>
  <rect x="318" y="218" width="32" height="134" rx="3" fill="url(#barg)" opacity="0.95"/>
  <rect x="364" y="234" width="32" height="118" rx="3" fill="url(#barg)" opacity="0.85"/>

  <!-- Bar top accent dots -->
  <circle cx="58"  cy="302" r="2" fill="rgba(34,211,238,0.7)"/>
  <circle cx="104" cy="268" r="2" fill="rgba(34,211,238,0.7)"/>
  <circle cx="150" cy="286" r="2" fill="rgba(34,211,238,0.7)"/>
  <circle cx="196" cy="256" r="2" fill="rgba(34,211,238,0.7)"/>
  <circle cx="242" cy="238" r="2" fill="rgba(34,211,238,0.7)"/>
  <circle cx="288" cy="260" r="2" fill="rgba(34,211,238,0.7)"/>
  <circle cx="334" cy="216" r="3" fill="rgba(34,211,238,0.95)" filter="url(#cglow)"/>
  <circle cx="380" cy="232" r="2" fill="rgba(34,211,238,0.7)"/>

  <!-- Month labels -->
  <text x="58"  y="370" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(161,161,170,0.4)">Jan</text>
  <text x="104" y="370" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(161,161,170,0.4)">Feb</text>
  <text x="150" y="370" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(161,161,170,0.4)">Mar</text>
  <text x="196" y="370" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(161,161,170,0.4)">Apr</text>
  <text x="242" y="370" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(161,161,170,0.4)">May</text>
  <text x="288" y="370" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(161,161,170,0.4)">Jun</text>
  <text x="334" y="370" text-anchor="middle" font-family="monospace" font-size="8.5" fill="rgba(34,211,238,0.6)" font-weight="700">Jul</text>
  <text x="380" y="370" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(161,161,170,0.4)">Aug</text>

  <!-- Anomaly flag on Jul bar -->
  <rect x="318" y="210" width="32" height="4" rx="2" fill="rgba(239,68,68,0.5)"/>
  <text x="334" y="206" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(239,68,68,0.7)">⚠ 3</text>

  <!-- Legend -->
  <rect x="28"  y="392" width="10" height="10" rx="2" fill="rgba(34,211,238,0.4)"/>
  <text x="42"  y="401" font-family="monospace" font-size="8" fill="rgba(161,161,170,0.45)">Monthly Spend</text>
  <rect x="150" y="392" width="10" height="10" rx="2" fill="rgba(239,68,68,0.35)"/>
  <text x="164" y="401" font-family="monospace" font-size="8" fill="rgba(161,161,170,0.45)">Anomaly</text>

  <!-- RIGHT: AI Narrative panel -->
  <rect x="414" y="158" width="370" height="256" rx="8" fill="rgba(34,211,238,0.025)" stroke="rgba(34,211,238,0.18)" stroke-width="1"/>

  <!-- Panel header -->
  <rect x="414" y="158" width="370" height="38" rx="8" fill="rgba(34,211,238,0.05)"/>
  <rect x="414" y="185" width="370" height="11" fill="rgba(34,211,238,0.05)"/>
  <rect x="414" y="195" width="370" height="1" fill="rgba(34,211,238,0.15)"/>
  <text x="426" y="183" font-family="monospace" font-size="10" font-weight="700" fill="rgba(34,211,238,0.85)">✦  AI Financial Story</text>
  <text x="770" y="183" text-anchor="end" font-family="monospace" font-size="8" fill="rgba(34,211,238,0.45)">Gemma 3:4b · local</text>

  <!-- Narrative text (simulating AI output) -->
  <text x="426" y="218" font-family="monospace" font-size="9" fill="rgba(250,250,250,0.65)">Your August spending reached $4,842 — up 8.2%</text>
  <text x="426" y="234" font-family="monospace" font-size="9" fill="rgba(250,250,250,0.65)">from July. Dining out surged 34%, which may</text>
  <text x="426" y="250" font-family="monospace" font-size="9" fill="rgba(250,250,250,0.65)">reflect summer social patterns or celebrations.</text>

  <text x="426" y="272" font-family="monospace" font-size="9" fill="rgba(250,250,250,0.5)">Three unusual transactions were flagged near</text>
  <text x="426" y="288" font-family="monospace" font-size="9" fill="rgba(250,250,250,0.5)">July 15th — two of them are outside your</text>
  <text x="426" y="304" font-family="monospace" font-size="9" fill="rgba(250,250,250,0.5)">typical merchant radius. Worth reviewing.</text>

  <text x="426" y="326" font-family="monospace" font-size="9" fill="rgba(34,211,238,0.6)">Based on your Q3 trend, September projected:</text>
  <text x="426" y="342" font-family="monospace" font-size="11" font-weight="700" fill="rgba(34,211,238,0.85)">$5,120  ±$280</text>

  <!-- Typing cursor -->
  <rect class="cursor" x="426" y="358" width="5" height="11" rx="1" fill="rgba(34,211,238,0.75)"/>

  <!-- "Ask Finara" prompt area -->
  <rect x="426" y="376" width="346" height="26" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="438" y="393" font-family="monospace" font-size="8.5" fill="rgba(161,161,170,0.35)">Ask Finara about your spending...</text>
  <rect x="744" y="379" width="22" height="20" rx="4" fill="rgba(34,211,238,0.2)" stroke="rgba(34,211,238,0.35)" stroke-width="1"/>
  <text x="755" y="392" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(34,211,238,0.8)">→</text>

  <!-- ── Bottom bar ── -->
  <rect x="0" y="424" width="800" height="26" fill="rgba(255,255,255,0.02)"/>
  <rect x="0" y="424" width="800" height="1" fill="rgba(255,255,255,0.05)"/>
  <text x="16" y="440" font-family="monospace" font-size="7.5" fill="rgba(161,161,170,0.3)">Java 17 · Spring Boot 3 · Python Flask · Gemma 3:4b · React 18 · PostgreSQL 15 · Docker</text>
  <circle cx="780" cy="437" r="3.5" fill="rgba(34,211,238,0.5)"/>
  <text x="773" y="440" text-anchor="end" font-family="monospace" font-size="7" fill="rgba(34,211,238,0.45)">AI local</text>
</svg>
